<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="700" viewBox="0 0 1600 700" role="img" aria-labelledby="title desc">
  <title id="title">Блок-схема eval-стенда: baseline и MVP</title>
  <desc id="desc">Подготовка задач и лимитов, выбор baseline H1+M1 или MVP из трёх пар, исполнение в общей изолированной среде, независимая проверка, отчёт и выбор конфигурации. Уточнение набора относится только к следующей итерации.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#111111"/>
    </marker>
    <marker id="feedback-arrow" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L13,6.5 L0,13 L3.5,6.5 Z" fill="#21836b"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #111111; text-anchor: middle; }
      .stage { font-size: 19px; }
      .label { font-size: 21px; }
      .body { font-size: 19px; }
      .node { stroke-width: 1.3; }
      .shared { fill: #dae8fc; stroke: #6c8ebf; }
      .mvp { fill: #d5e8d4; stroke: #82b366; }
      .baseline { fill: #ffe6cc; stroke: #d79b00; }
      .flow { fill: none; stroke: #111111; stroke-width: 1.6; }
    </style>
  </defs>
  <rect width="1600" height="700" fill="#ffffff"/>

  <!-- Обратная связь меняет только следующую итерацию. -->
  <path d="M1175 285 V100 Q1175 80 1155 80 H145 Q125 80 125 100 V281"
        fill="none" stroke="#21836b" stroke-width="3.5" stroke-dasharray="5 6"
        marker-end="url(#feedback-arrow)"/>
  <text x="650" y="56" style="font-size:20px;fill:#21836b">Уточнение набора для следующей итерации</text>

  <!-- Общая подготовка и разветвление по режимам. -->
  <path class="flow" d="M220 410 H245 V285 H267" marker-end="url(#arrow)"/>
  <path class="flow" d="M245 410 V517.5 H267" marker-end="url(#arrow)"/>
  <path class="flow" d="M470 285 H500 V410"/>
  <path class="flow" d="M470 517.5 H500 V410 H527" marker-end="url(#arrow)"/>
  <path class="flow" d="M760 410 H807" marker-end="url(#arrow)"/>
  <path class="flow" d="M1020 410 H1067" marker-end="url(#arrow)"/>
  <path class="flow" d="M1280 410 H1327" marker-end="url(#arrow)"/>

  <rect class="node shared" x="30" y="285" width="190" height="250"/>
  <text class="stage" x="125" y="318">Этап 0</text>
  <text class="label" x="125" y="352">Подготовка</text>
  <text class="body" x="125" y="397">
    <tspan x="125">Задачи</tspan>
    <tspan x="125" dy="29">Исходные файлы</tspan>
    <tspan x="125" dy="29">Чекеры</tspan>
    <tspan x="125" dy="29">Лимиты</tspan>
  </text>

  <text x="370" y="154" style="font-size:18px">Режим сравнения</text>
  <rect class="node mvp" x="270" y="190" width="200" height="190"/>
  <text class="stage" x="370" y="221">Этап 1</text>
  <text class="label" x="370" y="251">MVP</text>
  <text class="body" x="370" y="291">
    <tspan x="370">H1 + M1</tspan>
    <tspan x="370" dy="28">H1 + M2</tspan>
    <tspan x="370" dy="28">H2 + M1</tspan>
  </text>

  <rect class="node baseline" x="270" y="440" width="200" height="155"/>
  <text class="stage" x="370" y="474">Этап 1</text>
  <text class="label" x="370" y="507">Baseline</text>
  <text class="body" x="370" y="552">H1 + M1</text>

  <rect class="node shared" x="530" y="285" width="230" height="250"/>
  <text class="stage" x="645" y="318">Этап 2</text>
  <text class="label" x="645" y="352">Исполнение</text>
  <text class="body" x="645" y="395">
    <tspan x="645">Клиент и монтирование</tspan>
    <tspan x="645" dy="27">локальной папки</tspan>
    <tspan x="645" dy="43">Изолированный запуск</tspan>
    <tspan x="645" dy="27">на сервере</tspan>
  </text>

  <rect class="node shared" x="810" y="285" width="210" height="250"/>
  <text class="stage" x="915" y="318">Этап 3</text>
  <text class="label" x="915" y="352">Проверка</text>
  <text class="body" x="915" y="402">
    <tspan x="915">Отдельный чекер</tspan>
    <tspan x="915" dy="43">Успех или ошибка</tspan>
    <tspan x="915" dy="27">каждого запуска</tspan>
  </text>

  <rect class="node shared" x="1070" y="285" width="210" height="250"/>
  <text class="stage" x="1175" y="318">Этап 4</text>
  <text class="label" x="1175" y="352">Отчёт</text>
  <text class="body" x="1175" y="397">
    <tspan x="1175">Качество решений</tspan>
    <tspan x="1175" dy="29">Время выполнения</tspan>
    <tspan x="1175" dy="29">Расход токенов</tspan>
    <tspan x="1175" dy="29">Причины ошибок</tspan>
  </text>

  <rect class="node mvp" x="1330" y="285" width="240" height="250"/>
  <text class="stage" x="1450" y="318">Этап 5</text>
  <text class="label" x="1450" y="352">Выбор конфигурации</text>
  <text class="body" x="1450" y="402">
    <tspan x="1450">Сопоставление</tspan>
    <tspan x="1450" dy="27">результатов</tspan>
    <tspan x="1450" dy="43">с ограничениями</tspan>
    <tspan x="1450" dy="27">пользователя</tspan>
  </text>

  <text x="800" y="650" style="font-size:20px">Одинаковые задачи, лимиты и среда исполнения для всех пар</text>
</svg>

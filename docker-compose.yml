name: ${COMPOSE_PROJECT_NAME:-eval-stand}

x-build: &build
  context: .
  dockerfile: docker/Dockerfile.services
  args:
    SERVICE_UID: ${LOCAL_UID:-1000}
    SERVICE_GID: ${LOCAL_GID:-1000}

x-build-with-codex: &build-with-codex
  <<: *build
  additional_contexts:
    codex-source: service:codex-source

x-service: &service
  platform: ${DOCKER_PLATFORM:-linux/arm64}
  init: true
  restart: "no"
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  cpus: 0.09
  mem_limit: 192000000
  memswap_limit: 192000000
  pids_limit: 128
  tmpfs: ["/tmp:rw,noexec,nosuid,nodev,size=8000000,mode=1777"]
  logging:
    driver: local
    options: {max-size: "1m", max-file: "2"}

x-health: &health
  interval: 20s
  timeout: 20s
  retries: 6
  start_period: 45s

services:
  runner:
    <<: *service
    profiles: [tools]
    build: {<<: *build, target: runner}
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    networks: [control]
    cpus: 0.04
    mem_limit: 192000000
    memswap_limit: 192000000
    environment:
      GATEWAY_URL: http://gateway:8080
      CLIENT_TOKEN: ${CLIENT_TOKEN:-}
      RUNNER_STORAGE_BYTES: ${RUNNER_STORAGE_BYTES:-1000000000}
    volumes:
      - type: bind
        source: ${RESULTS_PATH:-./results}
        target: /results
        bind: {create_host_path: false}
    stop_grace_period: 100s

  codex-source:
    <<: *service
    build:
      context: .
      dockerfile: docker/Dockerfile.codex
      target: runtime
    image: eval-stand-codex:0.159.3
    pull_policy: never
    network_mode: none
    mem_limit: 64000000
    memswap_limit: 64000000
    command: ["--version"]

  # Одноразовая проверка образа сандбокса.
  sandbox-image:
    <<: *service
    build: {<<: *build-with-codex, target: sandbox}
    image: eval-stand-sandbox:0.159.3
    pull_policy: never
    network_mode: none
    mem_limit: 64000000
    memswap_limit: 64000000
    command: ["/usr/local/bin/codex", "--version"]
    depends_on:
      codex-source: {condition: service_completed_successfully}

  gateway:
    <<: *service
    build: {<<: *build, target: gateway}
    networks: [control, gateway-ingress]
    environment:
      PROJECT_ID: ${PROJECT_ID:-eval-stand}
      CLIENT_TOKEN: ${CLIENT_TOKEN:-}
      MANAGER_TOKEN: ${MANAGER_TOKEN:-}
      HARNESS_TOKEN: ${HARNESS_TOKEN:-}
      PROXY_TOKEN: ${PROXY_TOKEN:-}
      BROKER_TOKEN: ${BROKER_TOKEN:-}
      WORKSPACE_SSH_PORT: ${WORKSPACE_SSH_PORT:-2222}
      MANAGER_URL: http://sandbox-manager:8081
      HARNESS_URL: http://harness:8083
      PROXY_URL: http://llm-proxy:8000
      BROKER_URL: http://workspace-broker:8084
      GATEWAY_STATE: /state
      STATE_LIMIT_BYTES: ${STATE_LIMIT_BYTES:-1000000000}
      PROVENANCE_FILE: /runtime-provenance/provenance.json
    ports: ["127.0.0.1:${GATEWAY_PORT:-8080}:8080"]
    volumes:
      - gateway-state:/state
      - type: volume
        source: runtime-provenance
        target: /runtime-provenance
        read_only: true
        volume: {nocopy: true}
    depends_on:
      harness: {condition: service_healthy}
      sandbox-manager: {condition: service_healthy}
      llm-proxy: {condition: service_healthy}
    stop_grace_period: 100s
    healthcheck:
      <<: *health
      test: [CMD, python, /app/scripts/healthcheck.py, "http://127.0.0.1:8080/health", --token-env, CLIENT_TOKEN]

  harness:
    <<: *service
    build: {<<: *build-with-codex, target: harness}
    networks: [control]
    mem_limit: 512000000
    memswap_limit: 512000000
    environment:
      HARNESS_TOKEN: ${HARNESS_TOKEN:-}
      MANAGER_TOKEN: ${MANAGER_TOKEN:-}
      MANAGER_TUNNEL_URL: http://sandbox-manager:8082
      HARNESS_STATE: /state
      CODEX_BINARY: /usr/local/bin/codex
    volumes: [harness-state:/state]
    depends_on:
      sandbox-manager: {condition: service_healthy}
      llm-proxy: {condition: service_healthy}
    stop_grace_period: 100s
    healthcheck:
      <<: *health
      test: [CMD, python, /app/scripts/healthcheck.py, "http://127.0.0.1:8083/health", --token-env, HARNESS_TOKEN, --codex]

  workspace-broker:
    <<: *service
    build: {<<: *build, target: workspace-broker}
    networks: [control, workspace-ingress]
    mem_limit: 128000000
    memswap_limit: 128000000
    pids_limit: 32
    environment:
      BROKER_TOKEN: ${BROKER_TOKEN:-}
      BROKER_STATE: /state/workspace-broker
      BROKER_IPC: /ipc
    ports: ["127.0.0.1:${WORKSPACE_SSH_PORT:-2222}:2222"]
    volumes:
      - broker-state:/state
      - type: volume
        source: workspace-ipc
        target: /ipc
        volume: {nocopy: true}
    stop_grace_period: 30s
    healthcheck:
      <<: *health
      test: [CMD, python, /app/scripts/healthcheck.py, "http://127.0.0.1:8084/health", --token-env, BROKER_TOKEN]

  sandbox-manager:
    <<: *service
    build: {<<: *build, target: manager}
    networks: [control]
    environment:
      MANAGER_TOKEN: ${MANAGER_TOKEN:-}
      PROJECT_ID: ${PROJECT_ID:-eval-stand}
      MANAGER_STATE: /state
      SANDBOX_IMAGE: eval-stand-sandbox:0.159.3
      CODEX_SOURCE_IMAGE: eval-stand-codex:0.159.3
      RUNTIME_PROVENANCE_FILE: /runtime-provenance/provenance.json
      WORKSPACE_IPC_VOLUME: ${COMPOSE_PROJECT_NAME:-eval-stand}-workspace-ipc
    volumes:
      - manager-state:/state
      - type: volume
        source: runtime-provenance
        target: /runtime-provenance
        volume: {nocopy: true}
      - type: bind
        source: ${DOCKER_SOCKET:-/var/run/docker.sock}
        target: /var/run/docker.sock
        bind: {create_host_path: false}
    depends_on:
      codex-source: {condition: service_completed_successfully}
      sandbox-image: {condition: service_completed_successfully}
      workspace-broker: {condition: service_healthy}
    stop_grace_period: 100s
    healthcheck:
      <<: *health
      test: [CMD, python, /app/scripts/healthcheck.py, "http://127.0.0.1:8081/health", --token-env, MANAGER_TOKEN]

  llm-proxy:
    <<: *service
    build: {<<: *build, target: proxy}
    environment:
      INTERNAL_TOKEN: ${PROXY_TOKEN:-}
      PROFILES_PATH: /app/config/profiles.json
      PROXY_STATE_DIR: /state
    volumes: [proxy-state:/state]
    networks: [control, proxy-egress]
    stop_grace_period: 30s
    healthcheck:
      <<: *health
      test: [CMD, python, /app/scripts/healthcheck.py, "http://127.0.0.1:8000/health", --token-env, INTERNAL_TOKEN]

networks:
  control: {internal: true}
  gateway-ingress:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"
      com.docker.network.bridge.enable_icc: "false"
  workspace-ingress:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"
      com.docker.network.bridge.enable_icc: "false"
  proxy-egress: {}

volumes:
  broker-state:
  gateway-state:
  harness-state:
  manager-state:
  proxy-state:
  runtime-provenance:
  workspace-ipc:
    name: ${COMPOSE_PROJECT_NAME:-eval-stand}-workspace-ipc
    labels:
      io.eval-stand.role: workspace-ipc

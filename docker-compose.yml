# Заготовка. Все собственные сервисы собираются из исходников (build), базовые образы — с закреплённой версией.
# Как сандбокс-менеджер запускает сандбоксы (Docker socket / rootless / sysbox / gVisor) — решение в ADR.

services:
  gateway:
    build: ./services/gateway
    environment:
      CLIENT_TOKENS: ${CLIENT_TOKENS:-}
    ports: ["${GATEWAY_PORT:-8080}:8080"]
    depends_on: [harness]
    healthcheck: {test: ["CMD", "true"], interval: 10s}   # заменить на реальную проверку

  harness:
    build: ./services/harness
    environment:
      LLM_URL: http://llm-proxy:8000      # харнес ходит в модель только через прокси
    depends_on: [llm-proxy, sandbox-manager]
    healthcheck: {test: ["CMD", "true"], interval: 10s}

  sandbox-manager:
    build: ./services/sandbox-manager
    environment:
      SANDBOX_CPU: ${SANDBOX_CPU:-1}
      SANDBOX_MEMORY: ${SANDBOX_MEMORY:-1g}
      SANDBOX_PIDS: ${SANDBOX_PIDS:-256}
      SANDBOX_DISK: ${SANDBOX_DISK:-2g}
      SANDBOX_EXEC_TIMEOUT_S: ${SANDBOX_EXEC_TIMEOUT_S:-120}
    # volumes / privileges — по ADR о способе запуска сандбоксов
    healthcheck: {test: ["CMD", "true"], interval: 10s}

  llm-proxy:
    build: ./services/llm-proxy
    environment:
      LLM_PROVIDER_URL: ${LLM_PROVIDER_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}        # ключ только здесь
    healthcheck: {test: ["CMD", "true"], interval: 10s}

  # Тестовые сервисы для инфраструктурных тестов: docker compose --profile test up
  allowed-http:
    profiles: [test]
    image: nginx:1.27-alpine
  blocked-http:
    profiles: [test]
    image: nginx:1.27-alpine

[project]
name = "eval-stand-for-agents"
version = "0.1.0"
description = "Локальный стенд оценки базовых агентских функций"
requires-python = ">=3.11,<3.14"
dependencies = [
    "aiohttp>=3.12,<4",
    "jsonschema>=4.23,<5",
    "PyYAML==6.0.3",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff==0.17.3", "pre-commit==4.7.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers"
markers = ["docker: требуется подготовленный Docker-маршрут"]

[tool.ruff]
target-version = "py311"
line-length = 88
extend-exclude = ["results", "build"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
